<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Countdown</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Countdown">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏳</text></svg>">
<style>
:root{--bg:#0b0d1a;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.1);--tx:#f3f4ff;--mute:#9aa0c3;--a:#7c5cff;--b:#22d3ee;--c:#ff5ca8}
:root[data-theme=light]{--bg:#f2f3fb;--card:rgba(255,255,255,.8);--line:rgba(20,20,60,.1);--tx:#15173a;--mute:#5d628a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);
padding:calc(env(safe-area-inset-top,0px) + 20px) 18px calc(env(safe-area-inset-bottom,0px) + 30px);
background-image:radial-gradient(600px 400px at 10% -10%,rgba(124,92,255,.35),transparent),radial-gradient(500px 400px at 100% 10%,rgba(34,211,238,.22),transparent);background-attachment:fixed}
.wrap{max-width:480px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
h1{font-size:15px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.icon{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:16px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:26px 22px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.emoji{font-size:44px}
.title{font-size:24px;font-weight:700;margin:6px 0 2px}
.date{color:var(--mute);font-size:13px}
.ring{position:relative;width:220px;height:220px;margin:22px auto 18px}
.ring svg{transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,var(--b),var(--a),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
.lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.t{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 4px}
.t b{display:block;font-size:26px;font-variant-numeric:tabular-nums;font-weight:700}
.t span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.done .big{background:linear-gradient(135deg,#facc15,var(--c));-webkit-background-clip:text;background-clip:text}
h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:26px 4px 10px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.item.on{border-color:var(--a);box-shadow:0 0 0 1px var(--a) inset}
.item .e{font-size:24px}.item .m{flex:1;min-width:0}
.item .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .d{font-size:12px;color:var(--mute)}
.item .x{background:none;color:var(--mute);font-size:18px;padding:6px}
.fab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:58px;height:58px;border-radius:20px;font-size:28px;color:#fff;background:linear-gradient(135deg,var(--a),var(--c));box-shadow:0 10px 30px rgba(124,92,255,.5)}
dialog{border:1px solid var(--line);border-radius:26px;background:var(--bg);color:var(--tx);width:min(92vw,420px);padding:22px;margin:auto}
dialog::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(4px)}
dialog h3{margin-bottom:14px}
label{display:block;font-size:12px;color:var(--mute);margin:12px 0 6px}
input{width:100%;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;color-scheme:dark}
:root[data-theme=light] input{color-scheme:light}
.emojis{display:flex;gap:8px;flex-wrap:wrap}
.emojis button{width:42px;height:42px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:20px}
.emojis button.s{border-color:var(--a);background:rgba(124,92,255,.25)}
.row{display:flex;gap:10px;margin-top:20px}
.row button{flex:1;padding:14px;border-radius:14px;font-weight:600;background:var(--card);border:1px solid var(--line)}
.row .go{background:linear-gradient(135deg,var(--a),var(--c));border:0;color:#fff}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Countdown</h1><button class="icon" id="theme" aria-label="Theme">🌗</button></header>
  <div id="hero"></div>
  <h2>Your days</h2>
  <div id="list"></div>
</div>
<button class="fab" id="add" aria-label="Add">+</button>

<dialog id="dlg">
  <h3>New special day</h3>
  <label>Name</label><input id="name" placeholder="Birthday, Trip, Wedding…" maxlength="40">
  <label>Date</label><input id="date" type="date">
  <label>Time</label><input id="time" type="time" value="00:00">
  <label>Icon</label><div class="emojis" id="emojis"></div>
  <div class="row"><button id="cancel">Cancel</button><button class="go" id="save">Save</button></div>
</dialog>

<script>
const $=s=>document.querySelector(s), pad=n=>String(n).padStart(2,'0');
const EM=['🎉','🎂','✈️','💍','🎓','🎄','❤️','🚀'];
let ev=[],sel=null,pick=EM[0];
try{ev=JSON.parse(localStorage.getItem('cd_ev')||'[]');sel=localStorage.getItem('cd_sel');
 const th=localStorage.getItem('cd_th');if(th)document.documentElement.dataset.theme=th}catch(e){}
const save=()=>{try{localStorage.setItem('cd_ev',JSON.stringify(ev));localStorage.setItem('cd_sel',sel||'')}catch(e){}};
if(!ev.length){const d=new Date();d.setDate(d.getDate()+30);ev=[{id:'1',name:'My special day',emoji:'🎉',ts:d.setHours(0,0,0,0),created:Date.now()}];sel='1'}
if(!ev.find(e=>e.id===sel))sel=ev[0].id;

function render(){
  const e=ev.find(x=>x.id===sel),now=Date.now(),diff=e.ts-now,past=diff<=0,ms=Math.abs(diff);
  const d=Math.floor(ms/864e5),h=Math.floor(ms/36e5%24),m=Math.floor(ms/6e4%60),s=Math.floor(ms/1e3%60);
  const totalH=Math.floor(ms/36e5),pct=past?1:Math.min(1,Math.max(0,(now-e.created)/(e.ts-e.created)));
  const R=100,C=2*Math.PI*R;
  $('#hero').innerHTML=`<div class="hero ${past?'done':''}">
   <div class="emoji">${e.emoji}</div><div class="title">${esc(e.name)}</div>
   <div class="date">${new Date(e.ts).toLocaleString([],{weekday:'long',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'})}</div>
   <div class="ring"><svg width="220" height="220"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#7c5cff"/><stop offset="1" stop-color="#ff5ca8"/></linearGradient></defs>
    <circle cx="110" cy="110" r="${R}" fill="none" stroke="var(--line)" stroke-width="12"/>
    <circle cx="110" cy="110" r="${R}" fill="none" stroke="url(#g)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}"/></svg>
    <div class="in"><div class="big">${past?'🎊':totalH.toLocaleString()}</div><div class="lbl">${past?'It\'s here! '+d+'d ago':'hours left'}</div></div></div>
   <div class="grid"><div class="t"><b>${d}</b><span>Days</span></div><div class="t"><b>${pad(h)}</b><span>Hours</span></div><div class="t"><b>${pad(m)}</b><span>Min</span></div><div class="t"><b>${pad(s)}</b><span>Sec</span></div></div></div>`;
}
function esc(t){return t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function renderList(){
  const now=Date.now();
  $('#list').innerHTML=ev.length?ev.slice().sort((a,b)=>a.ts-b.ts).map(e=>{
    const dd=Math.ceil((e.ts-now)/864e5);
    return `<div class="item ${e.id===sel?'on':''}" data-id="${e.id}"><span class="e">${e.emoji}</span><div class="m"><div class="n">${esc(e.name)}</div><div class="d">${new Date(e.ts).toLocaleDateString()} · ${dd>0?dd+' days':'passed'}</div></div><button class="x" data-del="${e.id}" aria-label="Delete">✕</button></div>`}).join(''):'<div class="empty">No days yet. Tap + to add one.</div>';
}
$('#list').onclick=x=>{
  const del=x.target.dataset.del;
  if(del){ev=ev.filter(e=>e.id!==del);if(!ev.length){location.reload();return}if(sel===del)sel=ev[0].id;save();renderList();render();return}
  const it=x.target.closest('.item');if(it){sel=it.dataset.id;save();renderList();render();scrollTo({top:0,behavior:'smooth'})}
};
$('#emojis').innerHTML=EM.map((e,i)=>`<button data-e="${e}" class="${i?'':'s'}">${e}</button>`).join('');
$('#emojis').onclick=x=>{const b=x.target.closest('button');if(!b)return;pick=b.dataset.e;[...$('#emojis').children].forEach(c=>c.classList.toggle('s',c===b))};
$('#add').onclick=()=>{$('#name').value='';$('#date').value='';$('#date').min=new Date().toISOString().slice(0,10);$('#dlg').showModal()};
$('#cancel').onclick=()=>$('#dlg').close();
$('#save').onclick=()=>{
  const n=$('#name').value.trim(),d=$('#date').value;if(!n||!d){(!n?$('#name'):$('#date')).focus();return}
  const ts=new Date(d+'T'+($('#time').value||'00:00')).getTime();
  const e={id:String(Date.now()),name:n,emoji:pick,ts,created:Date.now()};
  ev.push(e);sel=e.id;save();$('#dlg').close();renderList();render();
};
$('#theme').onclick=()=>{const r=document.documentElement,t=r.dataset.theme==='light'?'dark':'light';r.dataset.theme=t;try{localStorage.setItem('cd_th',t)}catch(e){}};
save();renderList();render();setInterval(render,1000);setInterval(renderList,60000);
</script>
</body>
</html>
